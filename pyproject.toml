[project]
name = "doc-scanner-enhancer"
version = "3.0.0"
description = "Document scanning, classical image enhancement, restoration, and OCR evaluation engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "opencv-python>=4.9.0",
    "pillow>=10.2.0",
    "matplotlib>=3.8.0",
    "rapidocr-onnxruntime>=1.3.0",
    "Levenshtein>=0.25.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "qrcode>=8.2",
]

[project.scripts]
docscanner = "src.cli:main"
docscanner-server = "src.server:run"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
